name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build + Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec next lint

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: .next/
          retention-days: 3

  # E2E job queda DESHABILITADO hasta que exista staging
  # Para habilitar:
  # 1. Crear staging.autofixer.cl
  # 2. Configurar DATABASE_URL de staging en secrets
  # 3. Cambiar baseURL de playwright.config.ts a staging
  # 4. Descomentar el job e2e abajo
  e2e:
    name: E2E Tests (DISABLED - requires staging)
    runs-on: ubuntu-latest
    if: false  # DESHABILITADO - requiere staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: https://staging.autofixer.cl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
